<button class="ib lb" id="lg" aria-label="language">${L=='fa'?'EN':'فا'}</button><button class="ib" id="th" aria-label="theme">${ic(dark()?'sun':'moon')}</button><button class="ib m" id="mn" aria-label="menu">${ic('menu')}</button></div></header>
<div class="ov" id="ov"></div><aside class="sd" id="sd"><button class="ib" id="cl" aria-label="close">${ic('x')}</button>${SEC.map((s,i)=>`<a href="#${s}">${t('nav')[i]}</a>`).join('')}<a href="#order">${t('c1')}</a><a href="#admin">${t('adm')}</a></aside>`}
function ftr(){return `<footer><div class="w"><div class="fg"><div><a class="lg" href="#home">${ic('scale')}${t('brand')}</a><p style="color:var(--mu);margin-top:10px">${t('sub')}</p></div>
<div><h4>${t('ql')}</h4>${SEC.map((s,i)=>`<a href="#${s}">${t('nav')[i]}</a>`).join('')}</div>
<div><h4>${t('srv')}</h4>${S.slice(0,4).map((s,i)=>`<a href="#service-${i}">${s.t[L=='fa'?0:1]}</a>`).join('')}</div>
<div><h4>${t('ct')}</h4><a>${ic('phone')} <span dir="ltr">+98 21 0000 0000</span></a><a>${ic('mail')} info@yourdomain.com</a><a>${ic('pin')} ${t('ad')}</a></div></div>
<div class="cp">© ${new Date().getFullYear()} ${t('brand')} – ${t('rs')}</div></div></footer>`}
const card=(s,i)=>`<article class="cd rv">${cover(s)}<div class="cb"><h3>${s.t[L=='fa'?0:1]}</h3><p>${s.d[L=='fa'?0:1]}</p><div class="pr"><span>${cur(s.p)}</span><a href="#service-${i}" style="display:flex;gap:6px;align-items:center">${t('more')} ${ic('arrow','fl')}</a></div></div></article>`;
function home(){const l=L=='fa'?0:1;return `<section class="hero" id="home"><span class="bg" aria-hidden="true">${L=='fa'?'حق':'LAW'}</span><span class="bl"></span><div class="w"><h1 class="rv">${t('h1')} <em>${t('h1b')}</em></h1><p class="rv">${t('sub')}</p>
<div class="bt rv"><a class="btn" href="#order">${t('c1')} ${ic('arrow','fl')}</a><a class="btn g" href="#services">${t('c2')}</a></div>
<div class="st">${[[15,'+'],[1200,'+'],[900,'+'],[12,'']].map((a,i)=>`<div class="rv"><b data-n="${a[0]}" data-s="${a[1]}">0</b><span>${t('st')[i]}</span></div>`).join('')}</div></div></section>
<section id="services"><div class="w"><div class="hd rv"><small>01</small><h2>${t('srv')}</h2><p>${t('srvs')}</p></div><div class="gr">${S.map(card).join('')}</div></div></section>
<section id="about"><div class="w"><div class="hd rv"><small>02</small><h2>${t('ab')}</h2><p>${t('abs')}</p></div><div class="ft3">${t('f').map((f,i)=>`<div class="cd rv">${ic(['shield','users','chart'][i])}<h3>${f[0]}</h3><p style="color:var(--mu)">${f[1]}</p></div>`).join('')}</div></div></section>
<section id="reviews"><div class="w"><div class="hd rv"><small>03</small><h2>${t('rv')}</h2><p>${t('rvs')}</p></div><div class="two"><div style="display:grid;gap:14px">${RV.map(r=>`<div class="cd rv" style="padding:20px">${stars(r.r)}<p>${esc(r.x)}</p><b>${esc(L=='en'&&r.nE?r.nE:r.n)}</b></div>`).join('')}</div>
<form class="fm cd rv" id="rf" style="padding:24px;align-self:start"><input name="n" required placeholder="${t('yn')}" aria-label="${t('yn')}"><select name="r" aria-label="${t('rt')}">${[5,4,3,2,1].map(n=>`<option value="${n}">${t('rt')}: ${N(n)} / ${N(5)}</option>`).join('')}</select><textarea name="x" rows="4" required placeholder="${t('tx')}"></textarea><button class="btn">${t('sd')}</button></form></div></div></section>
<section id="contact"><div class="w"><div class="hd rv"><small>04</small><h2>${t('ct')}</h2><p>${t('cts')}</p></div><div class="two"><div class="rv"><div class="in">${ic('phone')}<span dir="ltr">+98 21 0000 0000</span></div><div class="in">${ic('mail')}info@yourdomain.com</div><div class="in">${ic('pin')}${t('ad')}</div></div>
<form class="fm cd rv" id="cf" style="padding:24px"><input required placeholder="${t('nm')}" aria-label="${t('nm')}"><input type="email" required placeholder="${t('em')}" aria-label="${t('em')}"><textarea rows="4" required placeholder="${t('ms')}"></textarea><button class="btn">${t('sd')}</button></form></div></div></section>`}
function product(i){const s=S[i],l=L=='fa'?0:1;return `<div class="w"><div class="pg"><div class="big rv">${cover(s)}</div><div class="rv"><a href="#services" style="color:var(--mu)">${ic('arrow',L=='fa'?'':'fl')} ${t('bk')}</a><h1 style="font-size:2.2rem;font-weight:900;line-height:1.3;margin:10px 0">${s.t[l]}</h1><p style="color:var(--mu)">${s.d[l]}</p>
<ul class="ul">${t('inc').map(x=>`<li>${ic('check')}${x}</li>`).join('')}</ul><p>${t('dur')}: <b>${N(s.dy)} ${t('days')}</b></p><p style="font-size:1.8rem;font-weight:900;color:var(--ac);margin:10px 0 20px">${cur(s.p)}</p><button class="btn" data-o="${i}">${t('c1')}</button></div></div>
<div class="hd"><h2>${t('srv')}</h2></div><div class="gr">${S.map((x,j)=>j!=i?card(x,j):'').join('')}</div></div>`}
function order(){return `<div class="w" style="max-width:640px;padding:50px 20px"><div class="hd rv"><h1 style="font-size:2.2rem;font-weight:900">${t('or')}</h1></div><form class="fm cd rv" id="of" style="padding:26px"><input name="n" required placeholder="${t('nm')}" aria-label="${t('nm')}"><input name="p" required placeholder="${t('ph')}" aria-label="${t('ph')}" dir="ltr"><input name="e" type="email" required placeholder="${t('em')}" aria-label="${t('em')}"><select name="s" aria-label="${t('sv')}">${S.map((s,i)=>`<option value="${i}" ${i==sel?'selected':''}>${s.t[L=='fa'?0:1]} – ${cur(s.p)}</option>`).join('')}</select><textarea name="x" rows="4" placeholder="${t('nt')}"></textarea><button class="btn">${t('c1')}</button></form></div>`}
function admin(){const rv=OD.reduce((a,o)=>a+S[o.s].p[L=='fa'?0:1],0),av=RV.length?(RV.reduce((a,r)=>a+r.r,0)/RV.length).toFixed(1):0;const l=L=='fa'?0:1;
const tb={dash:`<div class="st" style="margin:0 0 20px">${[[t('oc'),N(OD.length)],[t('rev'),L=='fa'?N(rv)+' ت':'$'+rv],[t('rw'),N(RV.length)],[t('avg'),N(av)]].map(a=>`<div><b style="font-size:1.5rem">${a[1]}</b><span>${a[0]}</span></div>`).join('')}</div><div class="cd" style="padding:20px">${S.map((s,i)=>{const c=OD.filter(o=>o.s==i).length;return `<p>${s.t[l]}</p><div class="bar" style="width:${Math.max(3,c/Math.max(1,OD.length)*100)}%"></div>`}).join('')}</div>`,
od:`<div class="tbw"><table><tr><th>#</th><th>${t('nm')}</th><th>${t('sr')}</th><th>${t('stt')}</th></tr>${OD.map((o,i)=>`<tr><td>${esc(o.id)}</td><td>${esc(o.n)}</td><td>${S[o.s].t[l]}</td><td><select class="sm" data-st="${i}">${['nw','pg','dn'].map(k=>`<option value="${k}" ${o.st==k?'selected':''}>${t(k)}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=4>—</td></tr>'}</table></div>`,
rw:`<div class="tbw"><table><tr><th>${t('nm')}</th><th>${t('rt')}</th><th>${t('tx')}</th><th></th></tr>${RV.map((r,i)=>`<tr><td>${esc(r.n)}</td><td>${stars(r.r)}</td><td>${esc(r.x)}</td><td><button class="ib" data-d="${i}" aria-label="delete">${ic('trash')}</button></td></tr>`).join('')}</table></div>`,
sr:`<div class="tbw"><table><tr><th>${t('sr')}</th><th>${t('dur')}</th><th>${t('c1')}</th></tr>${S.map(s=>`<tr><td>${s.t[l]}</td><td>${N(s.dy)} ${t('days')}</td><td>${cur(s.p)}</td></tr>`).join('')}</table></div>`}[tab];
return `<div class="w"><div class="ad"><div class="tabs">${[['dash','ds','chart'],['od','od','file'],['rw','rw','star'],['sr','sr','brief']].map(a=>`<button data-t="${a[0]}" class="${tab==a[0]?'a':''}">${ic(a[2])}${t(a[1])}</button>`).join('')}</div><div><h1 style="font-size:1.8rem;font-weight:900;margin-bottom:6px">${t('adm')}</h1><p style="color:var(--mu);font-size:.85rem;margin-bottom:18px">${t('dm')}</p>${tb}</div></div></div>`}
const dark=()=>TH?TH=='dark':matchMedia('(prefers-color-scheme:dark)').matches;
function toast(m){const e=document.createElement('div');e.className='ts';e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2800)}
function draw(){const h=location.hash.slice(1)||'home';document.documentElement.lang=L;document.documentElement.dir=L=='fa'?'rtl':'ltr';
if(TH)document.documentElement.dataset.theme=TH;let m,ti=t('brand')+' | '+t('tag');
if(/^service-\d$/.test(h)&&S[+h.slice(8)]){const i=+h.slice(8);m=product(i);ti=S[i].t[L=='fa'?0:1]+' – '+ti;view=h}else if(h=='order'){m=order();view=h}else if(h=='admin'){m=admin();view=h}else{m=home();view='home'}
$('#root').innerHTML=hdr()+'<main id="app">'+m+'</main>'+ftr();document.title=ti;
const md=document.querySelector('meta[name=description]');if(md)md.content=t('sub');
bind();reveal();if(view=='home'){const e=document.getElementById(h);h!='home'&&e?e.scrollIntoView({behavior:'smooth'}):scrollTo(0,0)}else scrollTo(0,0)}
function reveal(){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('v');const b=e.target.querySelector('[data-n]');if(b)cnt(b);io.unobserve(e.target)}}),{threshold:.12});document.querySelectorAll('.rv').forEach((e,i)=>{e.style.transitionDelay=(i%4)*90+'ms';io.observe(e)})}
function cnt(b){const n=+b.dataset.n,s=b.dataset.s;let k=0;const f=()=>{k+=Math.ceil(n/40);if(k>=n)k=n;b.textContent=N(k)+s;k<n&&requestAnimationFrame(f)};f()}
function bind(){const o=v=>{$('#sd').classList.toggle('o',v);$('#ov').classList.toggle('o',v)};
$('#mn').onclick=()=>o(true);$('#cl').onclick=$('#ov').onclick=()=>o(false);document.querySelectorAll('#sd a').forEach(a=>a.onclick=()=>o(false));
$('#lg').onclick=()=>{L=L=='fa'?'en':'fa';sv('lang',L);draw()};$('#th').onclick=()=>{TH=dark()?'light':'dark';sv('th',TH);document.documentElement.dataset.theme=TH;draw()};
document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{sel=+b.dataset.o;location.hash='order'});
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',()=>{if(a.getAttribute('href')=='#'+(location.hash.slice(1)||'home'))setTimeout(draw,0)}));
const rf=$('#rf');if(rf)rf.onsubmit=e=>{e.preventDefault();const d=new FormData(rf);RV.unshift({n:d.get('n'),r:+d.get('r'),x:d.get('x')});sv('rv',RV);draw();toast(t('ok'))};
const cf=$('#cf');if(cf)cf.onsubmit=e=>{e.preventDefault();cf.reset();toast(t('ok'))};
const of=$('#of');if(of)of.onsubmit=e=>{e.preventDefault();const d=new FormData(of),id='MZ-'+Math.floor(1000+Math.random()*9000);OD.unshift({id,n:d.get('n'),s:+d.get('s'),st:'nw'});sv('od',OD);of.innerHTML=`<p style="font-weight:800;text-align:center">${ic('check')} ${t('trk')} <span dir="ltr">${id}</span></p>`};
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
document.querySelectorAll('[data-st]').forEach(s=>s.onchange=()=>{OD[+s.dataset.st].st=s.value;sv('od',OD)});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{RV.splice(+b.dataset.d,1);sv('rv',RV);draw()})}
addEventListener('hashchange',()=>{const h=location.hash.slice(1)||'home';if(view=='home'&&(SEC.includes(h))){const e=document.getElementById(h);e&&e.scrollIntoView({behavior:'smooth'})}else draw()});
draw();
</script>
</body>
</html>
